[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calibre-news"
version = "0.2.0"
description = "Calibre‑based news aggregator"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
getnews = "calibre_news.cli:main"

[tool.setuptools]
packages = ["calibre_news", "calibre_news.recipes"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
